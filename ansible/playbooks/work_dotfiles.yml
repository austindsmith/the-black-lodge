---
# Collect dotfiles edited inside the VM back into the share, so `just
# pull-dotfiles` can rsync them into the dotfiles repo for review.
#
# Nothing here writes to the repo directly. The changes land in a working copy
# you diff and commit yourself -- an hour of komorebi tinkering in the VM
# should still arrive as a reviewable commit.

- name: Collect dotfiles from the work-kit VM
  hosts: work_kit
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../vagrant/windows/kit.yml"

  tasks:
    - name: Stage the live dotfiles into the share
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $dest = '{{ install_root }}\dotfiles-live\{{ item.src }}'
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        robocopy '{{ item.dest }}' $dest /MIR /NFL /NDL /NJH /NJS /NP /R:2 /W:2 `
          /XD '.git' | Out-Null
        if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
      loop: "{{ dotfiles }}"
      loop_control:
        label: "{{ item.src }}"
      changed_when: true

    - name: Report where the collected dotfiles landed
      ansible.builtin.debug:
        msg: >-
          Staged at \\{{ ansible_host }}\{{ share_name }}\dotfiles-live.
          `just pull-dotfiles` rsyncs it into $WINDOWS_DOTFILES_PATH.
