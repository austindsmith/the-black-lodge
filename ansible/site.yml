- name: Deploy Netbox server
  hosts: netbox-server-01
  tags:
    - netbox
  become: true
  roles:
    - common
    - cockpit
    - firewall
    - postgresql
    - redis
    - netbox

- name: Deploy Tang server
  hosts: tang
  tags:
    - tang
  become: true
  roles:
    - role: common
    - role: cockpit
    - role: firewall
    - role: tang

- name: Deploy Ed-Fi server
  hosts: edfi
  tags:
    - ed-fi
  become: true
  roles:
    - role: common
    - role: cockpit
    - role: firewall
    - role: docker
    - role: ed-fi

- name: Configure workstations
  hosts: workstations
  tags:
    - workstations
  roles:
    - role: workstations
