- name: Deploy Netbox server
  hosts: netbox-server-01
  tags:
    - netbox
  become: true
  roles:
    - common
    - cockpit
    - firewall
    - postgresql
    - redis
    - netbox

- name: Deploy Tang server
  hosts: tang
  tags:
    - tang
  become: true
  roles:
    - role: common
    - role: cockpit
    - role: firewall
    - role: tang

- name: Deploy Docker server
  hosts: docker
  become: true
  roles:
    - role: common
    - role: cockpit
    - role: firewall
    - role: docker
      tags:
        - docker

- name: Configure workstations
  hosts: workstations
  tags:
    - workstations
  roles:
    - role: workstations
