---
- name: Install the parser build script
  ansible.windows.win_template:
    src: Build-Parsers.ps1.j2
    dest: "{{ work_kit_build }}\\Build-Parsers.ps1"

- name: Bootstrap plugins and compile parsers
  ansible.windows.win_shell: >-
    cmd.exe /c "{{ work_kit_build }}\vcbuild.cmd"
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File "{{ work_kit_build }}\Build-Parsers.ps1"
  async: 5400
  poll: 30
  register: work_kit_parser_build
  changed_when: true

- name: Ship the populated plugin tree alongside the mirrors
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $data = '{{ ansible_env.LOCALAPPDATA }}\nvim-data'
    $dest = '{{ work_kit_root }}\nvim-data'
    if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
    Copy-Item -Path $data -Destination $dest -Recurse -Force
  changed_when: true
